<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vnkvm viewer</title>
<style>
  :root { --bg: #0f172a; --bar: #111827; --fg: #e5e7eb; --muted: #9ca3af; --accent: #2563eb; --on: #dc2626; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px -apple-system, Segoe UI, Helvetica, Arial, sans-serif; }
  header { display: flex; gap: 12px; align-items: center; padding: 8px 16px; background: var(--bar); position: sticky; top: 0; }
  header b { font-size: 15px; }
  .badge { padding: 2px 8px; border-radius: 999px; background: #1f2937; color: var(--muted); font-size: 12px; }
  .spacer { flex: 1; }
  button { font: inherit; padding: 6px 14px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; cursor: pointer; }
  button.on { background: var(--on); }
  button[hidden] { display: none; }
  main { padding: 12px 16px; }
  #stage > * { display: block; width: 100%; height: auto; max-height: calc(100vh - 80px); object-fit: contain; border-radius: 6px; background: #000; user-select: none; -webkit-user-drag: none; }
  #stage > [hidden] { display: none; }
  #stage.control > * { cursor: none; outline: 2px solid var(--on); }
  #msg { color: var(--muted); padding: 24px 0; }
</style>
</head>
<body>
<header>
  <b>vnkvm</b>
  <span class="badge" id="role">connecting</span>
  <span class="badge" id="status"></span>
  <span class="spacer"></span>
  <button id="toggle" hidden>Take control</button>
</header>
<main>
  <div id="msg"></div>
  <div id="stage">
    <canvas id="video" hidden></canvas>
    <img id="mjpeg" alt="Live screen" draggable="false" hidden>
  </div>
</main>
<script>
(() => {
  // The token rides in the URL fragment so it never reaches server logs.
  const token = new URLSearchParams(location.hash.slice(1)).get("token") || "";
  const q = "token=" + encodeURIComponent(token);
  const wsBase = (location.protocol === "https:" ? "wss:" : "ws:") + "//" + location.host;
  const $ = (id) => document.getElementById(id);
  const stage = $("stage"), canvas = $("video"), img = $("mjpeg"), toggle = $("toggle"), msg = $("msg");
  let view = img, ws = null, controlling = false, info = null;

  const setStatus = (mode) => { $("status").textContent = `${info.width}×${info.height} · ${mode} · ${info.fps} fps`; };

  fetch("/api/info?" + q).then((r) => {
    if (!r.ok) throw new Error("This link has no valid token.");
    return r.json();
  }).then((i) => {
    info = i;
    $("role").textContent = info.role === "control" ? "control" : "view only";
    if (info.role === "control") toggle.hidden = false;
    // H.264 needs WebCodecs, which browsers only offer on HTTPS or localhost.
    if (info.h264 && window.isSecureContext && "VideoDecoder" in window) startH264();
    else startMJPEG();
  }).catch((e) => { msg.textContent = e.message; $("role").textContent = "no access"; });

  function startMJPEG() {
    canvas.hidden = true;
    img.src = "/stream?" + q;
    img.hidden = false;
    view = img;
    setStatus("MJPEG");
  }

  function startH264() {
    const ctx2d = canvas.getContext("2d");
    const sock = new WebSocket(`${wsBase}/video?${q}`);
    sock.binaryType = "arraybuffer";
    let decoder = null, waitKey = true, frames = 0;
    // No picture within 5 s: fall back to MJPEG.
    const fallback = setTimeout(() => { if (!frames) { sock.close(); startMJPEG(); } }, 5000);

    sock.onmessage = (ev) => {
      if (typeof ev.data === "string") {
        const m = JSON.parse(ev.data);
        if (m.t !== "config") return;
        const c = m.config;
        if (decoder) decoder.close();
        decoder = new VideoDecoder({
          output: (frame) => {
            if (canvas.width !== frame.displayWidth) { canvas.width = frame.displayWidth; canvas.height = frame.displayHeight; }
            ctx2d.drawImage(frame, 0, 0);
            frame.close();
            if (!frames++) { clearTimeout(fallback); img.hidden = true; canvas.hidden = false; view = canvas; setStatus("H.264"); }
          },
          error: () => { sock.close(); startMJPEG(); },
        });
        const description = Uint8Array.from(atob(c.description), (ch) => ch.charCodeAt(0));
        decoder.configure({ codec: c.codec, description, codedWidth: c.width, codedHeight: c.height, optimizeForLatency: true });
        waitKey = true;
        return;
      }
      if (!decoder || decoder.state !== "configured") return;
      const buf = new DataView(ev.data);
      const key = buf.getUint8(0) === 1;
      if (waitKey && !key) return; // a decoder can only start at a keyframe
      waitKey = false;
      decoder.decode(new EncodedVideoChunk({
        type: key ? "key" : "delta",
        timestamp: Number(buf.getBigUint64(1)),
        data: new Uint8Array(ev.data, 9),
      }));
    };
    sock.onerror = () => { if (!frames) { clearTimeout(fallback); startMJPEG(); } };
  }

  const send = (ev) => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(ev)); };

  function start() {
    ws = new WebSocket(`${wsBase}/control?${q}`);
    ws.onopen = () => { controlling = true; stage.classList.add("control"); toggle.textContent = "Release control"; toggle.classList.add("on"); };
    ws.onclose = () => { stop(false); };
    ws.onerror = () => { msg.textContent = "Could not take control (someone else may be in control)."; };
  }
  function stop(close = true) {
    if (close && ws) { send({ t: "release" }); ws.close(); }
    ws = null; controlling = false;
    stage.classList.remove("control"); toggle.textContent = "Take control"; toggle.classList.remove("on");
  }
  toggle.onclick = () => (controlling ? stop() : (msg.textContent = "", start()));

  // Pointer position as a fraction of the picture, so display size never matters.
  const frac = (e) => {
    const r = view.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height };
  };
  let pending = null, last = null, settle = null, queued = false;
  stage.addEventListener("pointermove", (e) => {
    if (!controlling) return;
    pending = frac(e);
    if (queued) return; // at most one move per animation frame
    queued = true;
    requestAnimationFrame(() => {
      queued = false;
      if (!pending) return;
      last = pending; send({ t: "move", x: last.x, y: last.y }); pending = null;
      // After the hand stops, repeat the spot a few times so the cursor settles on it.
      clearInterval(settle); let n = 0;
      settle = setInterval(() => { if (++n > 4 || !controlling) return clearInterval(settle); send({ t: "move", x: last.x, y: last.y }); }, 50);
    });
  });
  const buttons = (e) => { if (controlling) { e.preventDefault(); send({ t: "move", ...frac(e) }); send({ t: "buttons", b: e.buttons }); } };
  stage.addEventListener("pointerdown", (e) => { stage.setPointerCapture(e.pointerId); buttons(e); });
  stage.addEventListener("pointerup", buttons);
  stage.addEventListener("contextmenu", (e) => { if (controlling) e.preventDefault(); });
  let wheelX = 0, wheelY = 0;
  stage.addEventListener("wheel", (e) => {
    if (!controlling) return;
    e.preventDefault();
    const unit = e.deltaMode === 1 ? 1 : 40; // lines, or pixels per notch
    wheelX += e.deltaX / unit; wheelY += e.deltaY / unit;
    const dx = Math.trunc(wheelX), dy = Math.trunc(wheelY);
    if (dx || dy) { wheelX -= dx; wheelY -= dy; send({ t: "wheel", dx, dy }); }
  }, { passive: false });
  const key = (down) => (e) => {
    if (!controlling) return;
    e.preventDefault();
    send({ t: "key", code: e.code, down });
  };
  window.addEventListener("keydown", key(true));
  window.addEventListener("keyup", key(false));
  // Leaving the tab must not leave keys held on the Mac.
  window.addEventListener("blur", () => send({ t: "release" }));
})();
</script>
</body>
</html>
